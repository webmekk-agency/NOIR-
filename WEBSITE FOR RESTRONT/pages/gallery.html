<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — NOIR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <a href="../index.html" class="logo">NOIR</a>
    <nav>
      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="gallery.html" class="active">Gallery</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="reservations.html" class="btn">Reserve a Table</a></li>
      </ul>
    </nav>
  </header>

  <section style="padding-top: 10rem;">
    <div class="section-title-wrap">
      <p class="section-subtitle">Visual Journey</p>
      <h1 class="section-title">The Gallery</h1>
    </div>

    <!-- Masonry Layout -->
    <div class="masonry-grid">
      <div class="masonry-item tall">
        <img src="https://images.unsplash.com/photo-1550966871-3ed3cdb5ed0c?auto=format&fit=crop&q=80&w=800" alt="Interior Details">
      </div>
      <div class="masonry-item">
        <img src="https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&q=80&w=800" alt="Fine Dining Food">
      </div>
      <div class="masonry-item">
        <img src="https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?auto=format&fit=crop&q=80&w=800" alt="Wine Selection">
      </div>
      <div class="masonry-item wide">
        <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&q=80&w=1200" alt="Main Dining Hall">
      </div>
      <div class="masonry-item">
        <img src="https://images.unsplash.com/photo-1577219491135-ce391730fb2c?auto=format&fit=crop&q=80&w=800" alt="Chef Preparing Dish">
      </div>
    </div>
  </section>

  <!-- Lightbox Overlay -->
  <div class="lightbox" id="lightbox">
    <span class="lightbox-close">&times;</span>
    <img src="" alt="Enlarged View" id="lightbox-img">
  </div>

  <footer>
    <div class="footer-bottom">
      <p>&copy; 2026 NOIR Fine Dining. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="../js/main.js"></script>
  <script>
    // Lightbox Logic
    const galleryItems = document.querySelectorAll('.masonry-item img');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.querySelector('.lightbox-close');

    galleryItems.forEach(item => {
      item.addEventListener('click', () => {
        lightboxImg.src = item.src;
        lightbox.classList.add('active');
      });
    });

    lightboxClose.addEventListener('click', () => {
      lightbox.classList.remove('active');
    });

    lightbox.addEventListener('click', (e) => {
      if(e.target === lightbox) lightbox.classList.remove('active');
    });
  </script>
</body>
</html>
