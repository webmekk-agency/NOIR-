<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserve a Table — NOIR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <a href="../index.html" class="logo">NOIR</a>
    <nav>
      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="reservations.html" class="active btn">Reserve a Table</a></li>
      </ul>
    </nav>
  </header>

  <section style="padding-top: 10rem;">
    <div class="section-title-wrap">
      <p class="section-subtitle">An Evening Worth Remembering</p>
      <h1 class="section-title">Reserve Your Table</h1>
    </div>

    <div class="reservation-container">
      <form id="reservationForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required placeholder="John Doe">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="john@example.com">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required>
          </div>
          <div class="form-group">
            <label for="time">Time</label>
            <input type="time" id="time" required>
          </div>
        </div>

        <div class="form-group">
          <label for="guests">Guests</label>
          <select id="guests">
            <option value="1">1 Guest</option>
            <option value="2" selected>2 Guests</option>
            <option value="4">4 Guests</option>
            <option value="6">6 Guests</option>
            <option value="8+">8+ Special Group</option>
          </select>
        </div>

        <button type="submit" class="btn btn-gold" style="width: 100%; margin-top: 1rem;">Confirm Reservation</button>
      </form>
    </div>
  </section>

  <footer>
    <div class="footer-bottom">
      <p>&copy; 2026 NOIR Fine Dining. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="../js/main.js"></script>
  <script src="../js/reservation.js"></script>
</body>
</html>
